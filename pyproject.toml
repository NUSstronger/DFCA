[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfca"
version = "0.1.0"
description = "DFCA: An Anisotropy-Aware Diffusion Framework for Two-Dimensional Crystal Generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "DFCA Authors"}]
keywords = [
    "crystal generation",
    "diffusion models",
    "two-dimensional materials",
    "materials informatics",
    "machine learning",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "h5py>=3.8",
    "torch>=2.0",
    "pymatgen>=2023",
    "monty>=2023",
    "spglib",
    "sympy",
    "ase>=3.22",
    "smact",
    "timm",
]

[project.optional-dependencies]
training = [
    "torchvision",
    "torchaudio",
]
screening = [
    "mace-torch>=0.3",
    "e3nn>=0.5",
    "phonopy>=2.18",
    "seekpath>=2.1",
]
dft = [
    "gpaw>=24.6",
    "mpi4py>=3.1",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dfca*", "diffusion*"]
